$schema: https://json-schema.org/draft/2020-12/schema
title: kubevirt-tenants chart values
type: object
additionalProperties: false
properties:
  tenants:
    description: tenants of this KubeVirt (hosting) cluster (one tenant per CAPK cluster)
    type: object
    propertyNames:
      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
      maxLength: 40
    additionalProperties:
      type: object
      additionalProperties: false
      properties:
        namespace:
          description: 'namespace holding the tenant VMs (default: the tenant name)'
          type: string
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          maxLength: 63
        management_namespace:
          description: 'management cluster namespace of the CAPK cluster of the tenant, the only one allowed to use the tenant
            credentials (default: the tenant namespace)'
          type: string
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          maxLength: 63
        addresses:
          description: 'IPs the Services of the tenant namespace may use (the cluster_virtual_ip of its cluster and the IPs
            of their LoadBalancer Services): IPv4 addresses or CIDRs (/28 at most)'
          type: array
          minItems: 1
          items:
            type: string
            pattern: ^[0-9]{1,3}(\.[0-9]{1,3}){3}(/(2[89]|3[0-2]))?$
        resource_quota:
          description: ResourceQuota spec.hard of the tenant namespace
          type: object
          additionalProperties:
            type:
              - string
              - integer
        network_policy:
          type: object
          additionalProperties: false
          properties:
            enabled:
              type: boolean
            egress_denied_cidrs:
              description: IPv4 CIDRs denied to the tenant VMs on top of pods_cidrs and the metadata service
              type: array
              items:
                type: string
                pattern: ^[0-9.]+/[0-9]+$
            ingress_allowed_ports:
              description: 'NetworkPolicyPort list allowed from anywhere to the tenant VMs (default: the top-level ingress_allowed_ports)'
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  - port
                properties:
                  protocol:
                    type: string
                    enum:
                      - TCP
                      - UDP
                      - SCTP
                  port:
                    type:
                      - integer
                      - string
                  endPort:
                    type: integer
      required:
        - addresses
  ingress_allowed_ports:
    description: NetworkPolicyPort list (otherwise allowed from anywhere to the tenant VMs)
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - port
      properties:
        protocol:
          type: string
          enum:
            - TCP
            - UDP
            - SCTP
        port:
          type:
            - integer
            - string
        endPort:
          type: integer
  pods_cidrs:
    description: pod CIDRs of the hosting cluster, denied to the tenant VMs (IPv6 and empty entries are ignored)
    type: array
    items:
      type: string
  nodes_cidrs:
    description: node network CIDRs of the hosting cluster, denied to the tenant VMs except on TCP 6443 (IPv6 and empty entries
      are ignored)
    type: array
    items:
      type: string
  allowed_priority_classes:
    description: priority classes the tenant VMs may use (none is always allowed)
    type: array
    items:
      type: string
  deny_metadata_service:
    description: deny egress to the cloud metadata service 169.254.169.254/32
    type: boolean
  metallb:
    type: object
    additionalProperties: false
    properties:
      enabled:
        description: create a per-tenant MetalLB IPAddressPool and L2Advertisement for the tenant addresses
        type: boolean
      namespace:
        type: string
        minLength: 1
      node_selectors:
        description: L2Advertisement nodeSelectors (LabelSelector list)
        type: array
        items:
          type: object
  api_server_address:
    description: API server address (IP or DNS name) of this cluster, published to the tenants as https://<address>:6443 (Secret
      capk-tenant-api)
    type: string
  credentials_stores:
    description: 'management cluster side: ClusterSecretStores reading a tenant namespace of a hosting cluster'
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      required:
        - kubeconfig_secret
        - remote_namespace
        - namespaces
      properties:
        kubeconfig_secret:
          type: object
          additionalProperties: false
          required:
            - name
            - namespace
            - key
          properties:
            name:
              type: string
            namespace:
              type: string
            key:
              type: string
        remote_namespace:
          description: the tenant namespace of the hosting cluster, the only one the store reads
          type: string
        namespaces:
          description: the management cluster namespaces that can use the store (that of the CAPK cluster of the tenant)
          type: array
          minItems: 1
          items:
            type: string
