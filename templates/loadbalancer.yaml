{{- /*
Confines the tenant Services to the tenant addresses (no other VIP, no externalIPs: CVE-2020-8554) and
keeps them off NodePorts, which would expose them on every hosting node: the ValidatingAdmissionPolicy denies
nodePorts (and externalTrafficPolicy: Local, which allocates a healthCheckNodePort), the MutatingAdmissionPolicy
stops their allocation for LoadBalancer Services.
*/ -}}
{{- range $tenant, $tenant_def := .Values.tenants }}
{{- $ns := $tenant_def.namespace | default $tenant }}
{{- $labels := tuple $ $tenant | include "kubevirt-tenants.labels" }}
{{- /* the tenant addresses as CIDRs, single IPs as /32 (the values schema checks their format) */}}
{{- $cidrs := list }}
{{- range $tenant_def.addresses }}
{{- $cidrs = append $cidrs (contains "/" . | ternary . (printf "%s/32" .)) }}
{{- end }}
{{- $cidrs = $cidrs | uniq }}
{{- $listed := $tenant_def.addresses | join ", " }}
{{- $pool := printf "kubevirt-tenant-%s" $tenant }}
{{- if $.Values.metallb.enabled }}
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: {{ $pool }}
  namespace: {{ $.Values.metallb.namespace }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  addresses:
    {{- range $cidrs }}
    - {{ . }}
    {{- end }}
  autoAssign: false
  avoidBuggyIPs: false
  serviceAllocation:
    namespaces:
      - {{ $ns }}
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: {{ $pool }}
  namespace: {{ $.Values.metallb.namespace }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  ipAddressPools:
    - {{ $pool }}
  {{- with $.Values.metallb.node_selectors }}
  nodeSelectors:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubevirt-tenant-{{ $tenant }}-services
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    # the namespace is kept on tenant removal: so is its isolation
    helm.sh/resource-policy: keep
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ $ns }}
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: [services]
  variables:
    - name: annotations
      expression: "has(object.metadata.annotations) ? object.metadata.annotations : {}"
    - name: tenant_cidrs
      expression: {{ $cidrs | toJson | quote }}
    # every IP the Service asks the load balancer for: both annotations (comma-separated lists) and spec.loadBalancerIP
    - name: requested_ips
      expression: >-
        (variables.annotations[?'metallb.io/loadBalancerIPs'].orValue('').split(',') +
         variables.annotations[?'kube-vip.io/loadbalancerIPs'].orValue('').split(',') +
         [has(object.spec.loadBalancerIP) ? object.spec.loadBalancerIP : ''])
        .map(i, i.trim()).filter(i, i != '')
    - name: foreign_ips
      expression: >-
        variables.requested_ips.filter(i, !(isIP(i) && variables.tenant_cidrs.exists(c, cidr(c).containsIP(i))))
  validations:
    - expression: "!has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0"
      message: "Services of KubeVirt tenant {{ $tenant }} cannot use externalIPs"
    - expression: "!has(object.spec.type) || object.spec.type != 'NodePort'"
      message: "Services of KubeVirt tenant {{ $tenant }} cannot be of type NodePort"
    - expression: "!has(object.spec.externalTrafficPolicy) || object.spec.externalTrafficPolicy != 'Local'"
      message: "Services of KubeVirt tenant {{ $tenant }} cannot use externalTrafficPolicy: Local (it opens a healthCheckNodePort on every hosting node)"
    # no automatic allocation, which could take an IP of another pool
    - expression: "!has(object.spec.type) || object.spec.type != 'LoadBalancer' || size(variables.requested_ips) > 0"
      message: "LoadBalancer Services of KubeVirt tenant {{ $tenant }} must request tenant IPs ({{ $listed }}) with the metallb.io/loadBalancerIPs or kube-vip.io/loadbalancerIPs annotation"
    - expression: "size(variables.foreign_ips) == 0"
      messageExpression: >-
        "Services of KubeVirt tenant {{ $tenant }} can only request the tenant IPs ({{ $listed }}), not " +
        variables.foreign_ips.join(', ')
    - expression: "!has(object.spec.ports) || object.spec.ports.all(p, !has(p.nodePort) || p.nodePort == 0)"
      message: "Services of KubeVirt tenant {{ $tenant }} cannot request nodePorts"
---
# kubevirt-ccm does not set 'svc.spec.allocateLoadBalancerNodePorts: false' itself
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: kubevirt-tenant-{{ $tenant }}-no-node-ports
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ $ns }}
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: [services]
  # required: the mutation is idempotent and no other mutation needs to see it
  reinvocationPolicy: Never
  matchConditions:
    - name: load-balancer
      expression: "has(object.spec.type) && object.spec.type == 'LoadBalancer'"
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: "Object{spec: Object.spec{allocateLoadBalancerNodePorts: false}}"
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: kubevirt-tenant-{{ $tenant }}-no-node-ports
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  policyName: kubevirt-tenant-{{ $tenant }}-no-node-ports
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kubevirt-tenant-{{ $tenant }}-services
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  policyName: kubevirt-tenant-{{ $tenant }}-services
  validationActions: [Deny]
{{- end }}
