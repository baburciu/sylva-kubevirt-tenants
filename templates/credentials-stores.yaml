{{- /*
Release on the management cluster: one ClusterSecretStore per tenant, through which External Secrets reads
the tenant namespace of the hosting cluster, for the listed namespaces of the management cluster only.
*/ -}}
{{- if and .Values.tenants .Values.credentials_stores }}
  {{- fail "kubevirt-tenants: 'tenants' (release on the hosting cluster) and 'credentials_stores' (release on the management cluster) cannot be set together" }}
{{- end }}
{{- range $name, $store := .Values.credentials_stores }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/name: {{ $.Chart.Name }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ $store.remote_namespace }}
      # kubeconfig of the hosting cluster
      authRef:
        {{- toYaml $store.kubeconfig_secret | nindent 8 }}
  conditions:
    - namespaces: {{ $store.namespaces | toJson }}
{{- end }}
