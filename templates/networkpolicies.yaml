{{- /*
NetworkPolicies apply after the kube-proxy DNAT: Service traffic is matched on the backend pod IPs,
hence the explicit allows for the tenant namespace and DNS.
*/ -}}
{{- $default_denied := list }}
{{- range .Values.pods_cidrs }}
  {{- if and . (not (contains ":" .)) }}{{- $default_denied = append $default_denied . }}{{- end }}
{{- end }}
{{- $nodes_cidrs := list }}
{{- range .Values.nodes_cidrs }}
  {{- if and . (not (contains ":" .)) }}{{- $nodes_cidrs = append $nodes_cidrs . }}{{- end }}
{{- end }}
{{- $default_denied = concat $default_denied $nodes_cidrs }}
{{- if .Values.deny_metadata_service }}{{- $default_denied = append $default_denied "169.254.169.254/32" }}{{- end }}
{{- range $tenant, $tenant_def := .Values.tenants }}
{{- $netpol := $tenant_def.network_policy | default dict }}
{{- if $netpol | dig "enabled" true }}
{{- $ns := $tenant_def.namespace | default $tenant }}
{{- $labels := tuple $ $tenant | include "kubevirt-tenants.labels" }}
{{- $except := concat $default_denied ($netpol.egress_denied_cidrs | default list) | uniq }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: capk-tenant-egress
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    # the namespace is kept on tenant removal: so is its isolation
    helm.sh/resource-policy: keep
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            {{- with $except }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
    - to:
        - podSelector: {}
    {{- with $nodes_cidrs }}
    # API of the hosting cluster (kubevirt-ccm and CSI driver of the tenant clusters)
    - to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 6443
    {{- end }}
    # CoreDNS of the hosting cluster: kube-system on Sylva (RKE2 and kubeadm)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: capk-tenant-ingress
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
    # SSH only from virt-api ('virtctl ssh')
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kubevirt
          podSelector:
            matchLabels:
              kubevirt.io: virt-api
      ports:
        - port: 22
          protocol: TCP
    # from anywhere: LoadBalancer traffic is SNATed to a hosting node IP, even from pods
    - ports:
        {{- $netpol.ingress_allowed_ports | default $.Values.ingress_allowed_ports | toYaml | nindent 8 }}
{{- end }}
{{- end }}
