{{- if .Values.tenants }}
# lets the KubeVirt CSI driver of a tenant read the PersistentVolumes backing its DataVolumes
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubevirt-tenant-pv-reader
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ .Chart.Name }}
rules:
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get]
{{- end }}
